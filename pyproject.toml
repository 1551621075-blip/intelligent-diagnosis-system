[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligent-diagnosis-system"
version = "0.1.0"
description = "原创合成场景上的确定性诊断、LightGBM 与证据门控系统"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "networkx>=3.3,<4",
  "typer>=0.15,<1",
  "jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
diag = "intelligent_diagnosis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_diagnosis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
